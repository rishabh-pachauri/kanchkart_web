apply plugin: 'com.android.application'

android {
    namespace 'com.kanchkart.app'
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.kanchkart.app"
        minSdkVersion 22
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (file("kanchkart-release-key.jks").exists()) {
                storeFile file("kanchkart-release-key.jks")
                storePassword "KanchKartPass2026!"
                keyAlias "kanchkart-key"
                keyPassword "KanchKartPass2026!"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
